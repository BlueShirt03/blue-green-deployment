name: blue-green-deployment

services:
  blue:
    build: .
    image: blue-green-app:v1
    environment:
      APP_VERSION: "1.0"
      APP_ENV: "blue"
    ports:
      - "127.0.0.1:4000:8000"
    restart: unless-stopped

  green:
    build: .
    image: blue-green-app:v2
    environment:
      APP_VERSION: "2.0"
      APP_ENV: "green"
    ports:
      - "127.0.0.1:4001:8000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - blue
      - green
    restart: unless-stopped
